<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Week 1 - Text Choreographer</title>
  <script src="lib/p5.js"></script>

</head>
<body>
  <div id="words"></div>
</body>
<style>
  body {
    margin: 0;
  }
  /* overlap the p5 canvas and the words instead of stacking them */
  canvas {
    position: fixed;
    top: 0;
    left: 0;
  }
  #words {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    width: 100vw;
    height: 100vh;
  }
