  <link rel="stylesheet" href="index.css">
  <style>
    /* dev control panel - not needed to add new text event types */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 20;
      background: black;
      padding: 8px 12px;
      border-radius: 6px 6px 0 0;
      font: 12px sans-serif;
      color: white;
    }

    input,
    select {
      background: black;
      color: white;
      border: 1px solid white;
      width: 70px;
    }

    #controls-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    #controls-fields {
      display: flex;
      gap: 10px;
    }

    #controls-fields label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
